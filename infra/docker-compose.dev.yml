# Local services for development. Postgres can also run natively (see README "Local development").
#   docker compose -f infra/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mehfil
      POSTGRES_PASSWORD: mehfil
      POSTGRES_DB: mehfil_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'mehfil']
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: mehfil
      MINIO_ROOT_PASSWORD: mehfil-dev-secret
    ports: ['9000:9000', '9001:9001']
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mehfil mehfil-dev-secret &&
      mc mb --ignore-existing local/mehfil-dev &&
      mc mb --ignore-existing local/mehfil-dev-idvault &&
      mc anonymous set none local/mehfil-dev"

volumes:
  pgdata:
  miniodata:
