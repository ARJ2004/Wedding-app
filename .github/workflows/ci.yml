name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mehfil
          POSTGRES_PASSWORD: mehfil
          POSTGRES_DB: mehfil_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mehfil" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for CI only; real secrets live in each environment's .env.
      NODE_ENV: test
      DATABASE_URL: postgresql://mehfil:mehfil@localhost:5432/mehfil_test
      JWT_HOST_SECRET: ci-only-host-secret-0123456789abcdef0123456789
      JWT_GUEST_SECRET: ci-only-guest-secret-0123456789abcdef012345678
      DEV_AUTH_ENABLED: 'true'
      OBJECT_STORE: fake
      MESSAGING_PROVIDER: log
      OPENAPI_DOCS: 'true'
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      - name: WhatsApp template catalogue
        run: pnpm --filter @mehfil/api run msg:templates check
      - name: Unit tests
        run: pnpm run test
      - name: Design schema applies to Postgres 16
        env:
          PGHOST: localhost
          PGUSER: mehfil
          PGPASSWORD: mehfil
        run: scripts/check-schema.sh mehfil_schema_check
      - name: Prisma schema matches the migrations
        env:
          SHADOW_DATABASE_URL: postgresql://mehfil:mehfil@localhost:5432/mehfil_shadow
          PGPASSWORD: mehfil
        run: |
          createdb -h localhost -U mehfil mehfil_shadow
          pnpm --filter @mehfil/api run prisma:drift
      - name: API end-to-end tests
        run: pnpm run test:e2e
      - name: API client is up to date with the API
        run: |
          pnpm run api-client:generate
          git diff --exit-code packages/api-client/openapi.json packages/api-client/src/schema.d.ts
      - name: Dependency audit (high and above)
        run: pnpm audit --audit-level high
